version: "3.8"

networks:
  ingress_net:
    driver: bridge
    internal: false
  db_net:
    driver: bridge
    internal: true
  proxy_net:
    driver: bridge
    internal: true
  control_net:
    driver: bridge
    internal: true

volumes:
  pgdata:

services:
  # Ingress Proxy / WAF (OWASP CRS)
  waf:
    image: owasp/modsecurity-crs:4-nginx-alpine
    container_name: demo-waf
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - ingress_net
      - proxy_net
    environment:
      - PARANOIA=1
      - PORT=8080
      - BACKEND=http://edge:8000
    volumes:
      - ./waf/nginx.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./waf/rules/active-patch.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-DEMO-VIRTUAL-PATCH.conf
      - ./waf/rules:/etc/modsecurity.d/rules-storage:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Target Microservice Stubs (4-tier lateral chain)
  edge:
    build:
      context: ./stubs
      dockerfile: Dockerfile
    container_name: demo-edge
    restart: unless-stopped
    networks:
      - proxy_net
      - control_net
    environment:
      - SERVICE_ROLE=edge
      - SERVICE_PORT=8000
      - DEFENDER_URL=http://defender:9000/ingest
      - CONTROL_TOKEN=demo-control-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3

  identity:
    build:
      context: ./stubs
      dockerfile: Dockerfile
    container_name: demo-identity
    restart: unless-stopped
    networks:
      - proxy_net
      - control_net
    environment:
      - SERVICE_ROLE=identity
      - SERVICE_PORT=8000
      - DEFENDER_URL=http://defender:9000/ingest
      - CONTROL_TOKEN=demo-control-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3

  workflow:
    build:
      context: ./stubs
      dockerfile: Dockerfile
    container_name: demo-workflow
    restart: unless-stopped
    networks:
      - proxy_net
      - control_net
    environment:
      - SERVICE_ROLE=workflow
      - SERVICE_PORT=8000
      - DEFENDER_URL=http://defender:9000/ingest
      - CONTROL_TOKEN=demo-control-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3

  records:
    build:
      context: ./stubs
      dockerfile: Dockerfile
    container_name: demo-records
    restart: unless-stopped
    networks:
      - proxy_net
      - control_net
    environment:
      - SERVICE_ROLE=records
      - SERVICE_PORT=8000
      - DEFENDER_URL=http://defender:9000/ingest
      - CONTROL_TOKEN=demo-control-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3

  # ML Behavioral Defender (IsolationForest Anomaly Classifier + Active Revocation)
  defender:
    build:
      context: ./defender
      dockerfile: Dockerfile
    container_name: demo-defender
    restart: unless-stopped
    networks:
      - control_net
    environment:
      - DEFENDER_PORT=9000
      - IDENTITY_URL=http://identity:8000/internal/revoke
      - WORKFLOW_URL=http://workflow:8000/internal/revoke
      - RECORDS_URL=http://records:8000/internal/revoke
      - CONTROL_TOKEN=demo-control-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3

  # PostgreSQL State Store for ARTEX
  postgres:
    image: postgres:16-alpine
    container_name: artex-postgres-1
    restart: unless-stopped
    networks:
      - db_net
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-artex}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-artex-demo-local}
      - POSTGRES_DB=${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ARTEX Autonomous Penetration Testing Agent
  artex:
    image: artex:local
    container_name: artex-artex-1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    networks:
      - ingress_net
      - db_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./skills/demo-api-chain:/app/skills/demo-api-chain:ro
    environment:
      - ARTEX_PG_DSN=postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD:-artex-demo-local}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      - ARTEX_LLM_PROVIDER=openai
      - ARTEX_LLM_MODEL=artex-local
      - ARTEX_LLM_BASE_URL=http://host.docker.internal:1234/v1
      - OPENAI_API_KEY=lm-studio
