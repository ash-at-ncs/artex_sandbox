<title>ARTEX | Wire Diagram Simulation</title>
<style>
  :root {
    --bg: #000000;
    --turquoise: #00f0ff;
    --turquoise-glow: rgba(0, 240, 255, 0.45);
    --green: #00ff77;
    --green-glow: rgba(0, 255, 119, 0.65);
    --green-wire: rgba(0, 255, 119, 0.22);
    --red: #ff2244;
    --red-glow: rgba(255, 34, 68, 0.85);
    --red-wire: #ff2244;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--bg);
    color: #fff;
    font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', Consolas, monospace;
  }

  /* Full screen canvas and graph viewport */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 50%, #03080e 0%, #000000 100%);
    overflow: hidden;
  }

  /* Faint background grid for circuit cyber aesthetic */
  .circuit-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0, 255, 119, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 119, 0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
  }

  /* TOP HEADER - Mode selection strip + NEW RUN + Live HUD */
  .top-bar {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    z-index: 1000;
    pointer-events: none;
  }

  /* 4 Run Type Scenario Buttons along the top */
  .mode-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }

  .mode-btn {
    background: rgba(9, 16, 24, 0.88);
    border: 1px solid rgba(88, 217, 219, 0.22);
    color: #8fa3b8;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    backdrop-filter: blur(8px);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    text-align: left;
  }

  .mode-btn:hover {
    border-color: var(--turquoise);
    color: #e6edf5;
    background: rgba(14, 28, 38, 0.95);
    transform: translateY(-1px);
  }

  .mode-btn.selected {
    background: rgba(0, 36, 44, 0.95);
    border-color: var(--turquoise);
    color: var(--turquoise);
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.35), inset 0 0 8px rgba(0, 240, 255, 0.15);
  }

  .mode-btn .mode-title {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #abbecd;
  }

  .mode-btn.selected .mode-title {
    color: var(--turquoise);
  }

  .mode-btn .mode-desc {
    font-size: 7.5px;
    letter-spacing: 0.05em;
    color: #64788c;
    white-space: nowrap;
  }

  .mode-btn.selected .mode-desc {
    color: #8bebf0;
  }

  .run-row {
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: auto;
  }

  #new-run-btn {
    pointer-events: auto;
    background: rgba(0, 30, 36, 0.85);
    border: 1.5px solid var(--turquoise);
    color: var(--turquoise);
    padding: 7px 24px;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 16px var(--turquoise-glow), inset 0 0 10px rgba(0, 240, 255, 0.2);
    backdrop-filter: blur(10px);
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #new-run-btn:hover {
    background: var(--turquoise);
    color: #001015;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.85), inset 0 0 15px rgba(255, 255, 255, 0.7);
    transform: scale(1.04);
  }

  #new-run-btn:active {
    transform: scale(0.98);
  }

  #new-run-btn .run-icon {
    font-size: 12px;
    display: inline-block;
    transition: transform 0.4s ease;
  }

  #new-run-btn:hover .run-icon {
    transform: rotate(180deg);
  }

  /* Live Outcome HUD under NEW RUN button */
  #run-hud {
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--turquoise);
    background: rgba(0, 16, 22, 0.8);
    border: 1px solid rgba(0, 240, 255, 0.25);
    padding: 4px 14px;
    border-radius: 3px;
    backdrop-filter: blur(6px);
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    transition: all 0.3s ease;
  }
  #run-hud.breached {
    color: var(--red);
    border-color: rgba(255, 34, 68, 0.4);
    text-shadow: 0 0 8px rgba(255, 34, 68, 0.6);
    background: rgba(26, 4, 8, 0.85);
  }
  #run-hud.contained {
    color: #65d7a5;
    border-color: rgba(101, 215, 165, 0.4);
    text-shadow: 0 0 8px rgba(101, 215, 165, 0.6);
    background: rgba(4, 20, 14, 0.85);
  }

  /* Discreet nav link to return to table view */
  .back-link {
    position: absolute;
    top: 20px;
    right: 26px;
    pointer-events: auto;
    color: rgba(255, 255, 255, 0.35);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 5px 11px;
    border-radius: 3px;
    transition: all 0.2s;
    z-index: 1000;
  }
  .back-link:hover {
    color: var(--turquoise);
    border-color: var(--turquoise);
    background: rgba(0, 240, 255, 0.08);
  }

  /* SVG layer for wires and pulses */
  #wire-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .wire {
    fill: none;
    stroke: var(--green-wire);
    stroke-width: 1.25;
    stroke-linecap: round;
    transition: stroke 0.4s ease, stroke-width 0.3s ease, filter 0.3s ease, stroke-opacity 0.4s ease;
  }

  .wire.active-wire {
    stroke: var(--green);
    stroke-opacity: 0.75;
    stroke-width: 1.8;
    filter: drop-shadow(0 0 4px var(--green));
  }

  .wire.hit-wire {
    stroke: var(--red);
    stroke-opacity: 0.95;
    stroke-width: 2.2;
    filter: drop-shadow(0 0 6px var(--red-glow));
    stroke-dasharray: none;
  }

  /* Traveling energy packet along wires */
  .wire-packet {
    fill: var(--red);
    filter: drop-shadow(0 0 6px var(--red));
  }

  /* DOM Nodes Layer */
  #nodes-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    pointer-events: none;
  }

  /* Smaller, sleek node items */
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.15);
    z-index: 100;
  }

  /* Node Icon Box - Smaller */
  .node-icon-wrapper {
    position: relative;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Ambient glowing ring around icon */
  .node-halo {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px dashed var(--green);
    opacity: 0.35;
    transition: all 0.4s ease;
    animation: rotateSlow 25s linear infinite;
  }

  @keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* The Icon itself using pure CSS Mask: smaller, crisp, transparent */
  .node-icon {
    width: 26px;
    height: 26px;
    background-color: var(--green);
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-size: contain;
    mask-repeat: no-repeat;
    mask-position: center;
    filter: drop-shadow(0 0 5px var(--green-glow));
    transition: background-color 0.4s ease, filter 0.4s ease, transform 0.3s ease;
  }

  /* Node Label - Very Light Green for maximum legibility */
  .node-label {
    margin-top: 4px;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #d4ffe8;
    text-shadow: 0 0 5px rgba(212, 255, 232, 0.45);
    white-space: nowrap;
    text-align: center;
    max-width: 130px;
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }

  /* KEV Title underneath in RED (hidden initially, displays on hit) */
  .node-kev {
    margin-top: 3px;
    font-size: 7.5px;
    font-weight: 700;
    color: var(--red);
    text-shadow: 0 0 7px var(--red-glow);
    white-space: nowrap;
    text-align: center;
    max-width: 140px;
    background: rgba(45, 6, 12, 0.88);
    border: 1px solid rgba(255, 34, 68, 0.55);
    border-radius: 3px;
    padding: 2px 5px;
    opacity: 0;
    transform: translateY(-3px) scale(0.9);
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255, 34, 68, 0.3);
  }

  .node-kev .cve {
    font-weight: 800;
    letter-spacing: 0.05em;
  }

  .node-kev .vuln-title {
    display: block;
    font-size: 7px;
    opacity: 0.9;
    font-weight: 500;
  }

  /* HIT STATE: Lit in RED */
  .node.hit .node-icon {
    background-color: var(--red);
    filter: drop-shadow(0 0 12px var(--red-glow)) drop-shadow(0 0 20px var(--red));
    transform: scale(1.1);
  }

  .node.hit .node-halo {
    border-color: var(--red);
    border-style: solid;
    opacity: 0.85;
    box-shadow: 0 0 12px var(--red-glow);
    animation: hitPulse 1.2s ease-out infinite alternate;
  }

  .node.hit .node-label {
    color: #ff8899;
    text-shadow: 0 0 8px var(--red-glow);
  }

  .node.hit .node-kev {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* DEFENDED / BLOCKED STATE */
  .node.defended .node-icon {
    background-color: #f3bd64;
    filter: drop-shadow(0 0 10px rgba(243, 189, 100, 0.8));
    transform: scale(1.05);
  }
  .node.defended .node-halo {
    border-color: #f3bd64;
    border-style: double;
    opacity: 0.85;
    box-shadow: 0 0 10px rgba(243, 189, 100, 0.5);
  }
  .node.defended .node-label {
    color: #f3bd64;
    text-shadow: 0 0 6px rgba(243, 189, 100, 0.6);
  }
  .node.defended .node-kev {
    opacity: 1;
    transform: translateY(0) scale(1);
    color: #f3bd64;
    border-color: rgba(243, 189, 100, 0.6);
    background: rgba(30, 22, 6, 0.88);
    text-shadow: 0 0 8px rgba(243, 189, 100, 0.5);
    box-shadow: 0 0 10px rgba(243, 189, 100, 0.3);
  }

  /* DATABASE CLUSTER BREACH TARGET */
  .node.breach-target .node-icon {
    background-color: #ff003c;
    filter: drop-shadow(0 0 16px #ff003c) drop-shadow(0 0 28px #ff003c);
    animation: breachShake 0.4s ease infinite alternate;
  }
  .node.breach-target .node-kev {
    border-color: #ff003c;
    background: rgba(50, 0, 12, 0.95);
    box-shadow: 0 0 16px rgba(255, 0, 60, 0.7);
  }

  @keyframes breachShake {
    0% { transform: scale(1.12) rotate(-2deg); }
    100% { transform: scale(1.15) rotate(2deg); }
  }

  .wire.defended-wire {
    stroke: #765d34 !important;
    stroke-opacity: 0.7 !important;
    stroke-dasharray: 4 4 !important;
  }

  @keyframes hitPulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.22); opacity: 0.3; }
  }

  /* Flash impact burst when hit */
  .impact-burst {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--red);
    pointer-events: none;
    animation: burstExpand 0.65s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
  }

  @keyframes burstExpand {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(5.5); opacity: 0; }
  }
</style>

let inFlightOperations = 0;
let layerHits = [0, 0, 0, 0];
let currentMode = 'baseline';

// Scenario defense probabilities per layer
const DEFENSE_SCENARIOS = {
  baseline: {
    tag: '01 / BASELINE',
    name: 'Baseline (Unmitigated)',
    p0: 0.0,
    p1: 0.0,
    p2: 0.0
  },
  patch: {
    tag: '02 / VIRTUAL PATCH',
    name: 'Virtual Patch (WAF)',
    p0: 0.60,
    p1: 0.0,
    p2: 0.0
  },
  defender: {
    tag: '03 / BEHAVIORAL ML',
    name: 'Behavioral ML Defense',
    p0: 0.0,
    p1: 0.45,
    p2: 0.70
  },
  combined: {
    tag: '04 / DEFENSE-IN-DEPTH',
    name: 'Combined Defense-in-Depth',
    p0: 0.60,
    p1: 0.55,
    p2: 0.80
  }
};

const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

const viewport = document.getElementById('viewport');
const svg = document.getElementById('wire-svg');
const nodesLayer = document.getElementById('nodes-layer');
const newRunBtn = document.getElementById('new-run-btn');
const runHud = document.getElementById('run-hud');

/**
 * Organically position all objects across the screen and cluster them neatly.
 * Nodes are smaller, more numerous, and neatly grouped.
 */
function layoutGraph() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  currentNodes = [];
  currentWires = [];
  nodesLayer.innerHTML = '';
  svg.innerHTML = '';

  LAYER_CONFIG.forEach((layer, layerIdx) => {
    const numClusters = layer.clusters.length;
    const clusterHeight = (h * 0.76) / numClusters;
    const startY = h * 0.13;
    const layerKevPool = shuffle(LAYER_KEVS[layerIdx]);
    let kevIdx = 0;

    layer.clusters.forEach((cluster, clusterIdx) => {
      const clusterCenterY = startY + clusterIdx * clusterHeight + clusterHeight * 0.5 + rand(-h * 0.03, h * 0.03);
      const clusterCenterX = w * (layer.xBand[0] + (layer.xBand[1] - layer.xBand[0]) * 0.5) + rand(-w * 0.02, w * 0.02);

      const numNodes = cluster.nodes.length;
      cluster.nodes.forEach((rawNode, nodeIdx) => {
        // Generously separated cluster layout for maximum text legibility
        const angle = (nodeIdx / numNodes) * Math.PI * 2 - Math.PI / 2 + rand(-0.1, 0.1);
        const radiusX = rand(52, 68);
        const radiusY = rand(40, 54);

        const nx = Math.max(w * 0.05, Math.min(w * 0.94, clusterCenterX + Math.cos(angle) * radiusX));
        const ny = Math.max(h * 0.12, Math.min(h * 0.88, clusterCenterY + Math.sin(angle) * radiusY));

        const kev = layerKevPool[kevIdx % layerKevPool.length];
        kevIdx++;

        const node = {
          id: rawNode.id,
          label: rawNode.label,
          icon: rawNode.icon,
          isSecurity: !!rawNode.isSecurity,
          isLake: !!rawNode.isLake,
          isDb: !!rawNode.isDb,
          layerIdx: layerIdx,
          clusterName: cluster.name,
          x: nx,
          y: ny,
          kev: kev,
          hit: false,
          defended: false,
          downstream: [],
          el: null
        };

        currentNodes.push(node);
      });
    });
  });

  // Wires between layers
  currentNodes.forEach(source => {
    if (source.layerIdx < LAYER_CONFIG.length - 1) {
      const nextLayerNodes = currentNodes.filter(n => n.layerIdx === source.layerIdx + 1);
      const sortedCandidates = [...nextLayerNodes].sort((a, b) => Math.abs(a.y - source.y) - Math.abs(b.y - source.y));

      const numConn = randInt(1, Math.min(2, sortedCandidates.length));
      for (let i = 0; i < numConn; i++) {
        const pickIdx = Math.min(sortedCandidates.length - 1, Math.floor(Math.pow(Math.random(), 1.5) * sortedCandidates.length));
        const target = sortedCandidates[pickIdx];
        if (target && !source.downstream.includes(target.id)) {
          source.downstream.push(target.id);
          createWire(source, target);
        }
      }
    }
  });

  // Ensure every node has ingress connection
  currentNodes.forEach(target => {
    if (target.layerIdx > 0) {
      const hasUpstream = currentWires.some(w => w.target.id === target.id);
      if (!hasUpstream) {
        const prevLayerNodes = currentNodes.filter(n => n.layerIdx === target.layerIdx - 1);
        if (prevLayerNodes.length > 0) {
          const source = prevLayerNodes.reduce((closest, curr) => 
            Math.abs(curr.y - target.y) < Math.abs(closest.y - target.y) ? curr : closest
          );
          source.downstream.push(target.id);
          createWire(source, target);
        }
      }
    }
  });

  // Render DOM Nodes with smaller icons
  currentNodes.forEach(node => {
    const el = document.createElement('div');
    el.className = 'node';
    el.id = 'node-' + node.id;
    el.style.left = `${node.x}px`;
    el.style.top = `${node.y}px`;

    el.innerHTML = `
      <div class="node-icon-wrapper">
        <div class="node-halo"></div>
        <div class="node-icon" style="-webkit-mask-image: url('${ICON_BASE}${node.icon}'); mask-image: url('${ICON_BASE}${node.icon}');"></div>
      </div>
      <div class="node-label">${node.label}</div>
      <div class="node-kev">
        <span class="cve">${node.kev.id}</span>
        <span class="vuln-title">${node.kev.title}</span>
      </div>
    `;

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerNodeHit(node);
    });

    nodesLayer.appendChild(el);
    node.el = el;
  });
}

/**
 * Straight circuit lines between clusters (Commit 2 version)
 */
function createWire(source, target) {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('class', 'wire');

  // Straight line connection
  const d = `M ${source.x} ${source.y} L ${target.x} ${target.y}`;
  path.setAttribute('d', d);

  svg.appendChild(path);

  currentWires.push({
    source,
    target,
    path,
    hit: false,
    defended: false
  });
}

function triggerNodeHit(node, isExfil = false, customKev = null) {
  if (node.hit || node.defended) return;
  node.hit = true;
  runStats.hits++;

  if (node.el) {
    node.el.classList.add('hit');
    if (isExfil || node.isLake || node.isDb) {
      node.el.classList.add('breach-target');
      runStats.lakesBreached++;
      const kevEl = node.el.querySelector('.node-kev');
      if (kevEl) {
        const vulnText = customKev ? `${customKev.id} · ${customKev.title}` : `${node.kev.id} · ${node.kev.title}`;
        kevEl.innerHTML = `<span class="cve">CANARY_TOKEN EXFILTRATED</span><span class="vuln-title">${vulnText}</span>`;
      }
    }

    const burst = document.createElement('div');
    burst.className = 'impact-burst';
    burst.style.left = `${node.x}px`;
    burst.style.top = `${node.y}px`;
    nodesLayer.appendChild(burst);
    setTimeout(() => burst.remove(), 700);
  }
}

function triggerNodeDefense(node, wire) {
  if (node.hit || node.defended) return;
  node.defended = true;
  runStats.blocks++;

  if (node.el) {
    node.el.classList.add('defended');
    const kevEl = node.el.querySelector('.node-kev');
    if (kevEl) {
      let badgeTitle = 'CONTAINED · DEFENSE SHIELD';
      if (currentMode === 'patch') {
        badgeTitle = 'SHIELDED · WAF VIRTUAL PATCH';
      } else if (currentMode === 'defender') {
        badgeTitle = 'CONTAINED · BEHAVIORAL ML [SI-4]';
      } else if (currentMode === 'combined') {
        badgeTitle = node.layerIdx <= 1 ? 'SHIELDED · WAF VIRTUAL PATCH' : 'CONTAINED · ML ZERO-TRUST';
      }
      kevEl.innerHTML = `<span class="cve">${badgeTitle}</span><span class="vuln-title">Mitigated ${node.kev.id} [${node.kev.tech}]</span>`;
    }
  }

  if (wire) {
    wire.defended = true;
    wire.path.classList.add('defended-wire');
  }
}

function animateWirePulse(wire, onComplete) {
  const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  pulse.setAttribute('r', '3.5');
  pulse.setAttribute('class', 'wire-packet');
  svg.appendChild(pulse);

  wire.path.classList.add('active-wire');

  const pathEl = wire.path;
  const totalLength = pathEl.getTotalLength();
  const duration = rand(380, 700);
  const startTime = performance.now();

  function step(time) {
    const elapsed = time - startTime;
    const progress = Math.min(1, elapsed / duration);
    const point = pathEl.getPointAtLength(progress * totalLength);

    pulse.setAttribute('cx', point.x);
    pulse.setAttribute('cy', point.y);

    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      pulse.remove();
      wire.path.classList.remove('active-wire');
      if (onComplete) onComplete();
    }
  }

  requestAnimationFrame(step);
}

function startSimulation() {
  isSimulating = true;
  runCount++;
  runStats = { hits: 0, blocks: 0, lakesBreached: 0 };
  inFlightOperations = 0;
  layerHits = [0, 0, 0, 0];

  const scn = DEFENSE_SCENARIOS[currentMode] || DEFENSE_SCENARIOS.baseline;
  runHud.className = '';
  runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · TRAVERSING PERIMETER INGRESS...`;

  layoutGraph();

  // 1-2 ingress nodes initiate attack
  const ingressNodes = currentNodes.filter(n => n.layerIdx === 0);
  const startCount = randInt(1, 2);
  const startNodes = shuffle(ingressNodes).slice(0, startCount);

  startNodes.forEach((startNode, i) => {
    inFlightOperations++;
    setTimeout(() => {
      triggerNodeHit(startNode);
      layerHits[0]++;
      traverseFromNode(startNode, 1);
      decrementInFlight();
    }, 250 + i * 350);
  });
}

function traverseFromNode(node, depth) {
  if (depth > 3) return;
  if (layerHits[depth] >= 3) return;

  const outgoingWires = currentWires.filter(w => w.source.id === node.id && !w.target.hit && !w.target.defended);
  if (outgoingWires.length === 0) return;

  const remainingBudget = 3 - layerHits[depth];
  if (remainingBudget <= 0) return;

  // 1-2 chaining per step, capped to max 3 hits per layer
  const chainCount = Math.min(remainingBudget, randInt(1, 2));
  const selectedWires = shuffle(outgoingWires).slice(0, chainCount);

  selectedWires.forEach((wire, idx) => {
    inFlightOperations++;
    const wireDelay = rand(300, 600) + idx * 200;
    setTimeout(() => {
      animateWirePulse(wire, () => {
        const target = wire.target;
        if (target.hit || target.defended) {
          decrementInFlight();
          return;
        }

        // Scenario-driven defense containment check:
        // In Baseline (unmitigated), there are zero active defenses (0% containment)
        let isDefended = false;
        if (currentMode !== 'baseline') {
          const scn = DEFENSE_SCENARIOS[currentMode] || DEFENSE_SCENARIOS.baseline;
          const baseProb = depth === 1 ? scn.p0 :
                           depth === 2 ? scn.p1 :
                           depth === 3 ? scn.p2 : 0;
          const securityBonus = target.isSecurity ? 0.25 : 0;
          isDefended = Math.random() < Math.min(0.95, baseProb + securityBonus);
        }

        if (isDefended) {
          triggerNodeDefense(target, wire);
          decrementInFlight();
        } else {
          if (layerHits[depth] < 3) {
            layerHits[depth]++;
            wire.hit = true;
            wire.path.classList.add('hit-wire');
            const isFinalLake = target.layerIdx === 3;
            triggerNodeHit(target, isFinalLake);

            // Backend Clustered Database Lateral Compromise:
            // "at the backend there might be a few databases clustered and 1 or 2 get hacked by a given vuln, up to 3."
            if (isFinalLake && target.isDb) {
              const clusterPeers = currentNodes.filter(n => 
                n.layerIdx === 3 && n.clusterName === target.clusterName && n.id !== target.id && !n.hit && !n.defended
              );
              const extraDbCount = Math.min(randInt(1, 2), 3 - layerHits[3]);
              if (extraDbCount > 0 && clusterPeers.length > 0) {
                const victims = shuffle(clusterPeers).slice(0, extraDbCount);
                victims.forEach((vic, vIdx) => {
                  setTimeout(() => {
                    layerHits[3]++;
                    triggerNodeHit(vic, true, target.kev);
                  }, 280 + vIdx * 200);
                });
              }
            }

            if (!isFinalLake) {
              traverseFromNode(target, depth + 1);
            }
          }
          decrementInFlight();
        }
      });
    }, wireDelay);
  });
}

function decrementInFlight() {
  inFlightOperations = Math.max(0, inFlightOperations - 1);
  if (inFlightOperations === 0) {
    finalizeSimulation();
  }
}

function finalizeSimulation() {
  isSimulating = false;
  const scn = DEFENSE_SCENARIOS[currentMode] || DEFENSE_SCENARIOS.baseline;
  if (runStats.lakesBreached > 0) {
    runHud.className = 'breached';
    runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · ${runStats.hits} KEVs EXPLOITED · ${runStats.blocks} CONTAINED · DATABASE BREACH DETECTED [CANARY_ALPHA_7739]`;
  } else {
    runHud.className = 'contained';
    runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · ${runStats.blocks} BLOCKED AT BOUNDARY · ZERO-TRUST ARCHITECTURE PROTECTED DATABASES`;
  }

  if (window._onSimulationDone) {
    window._onSimulationDone({
      run: runCount,
      scenario: currentMode,
      hits: runStats.hits,
      blocks: runStats.blocks,
      lakesBreached: runStats.lakesBreached,
      status: runStats.lakesBreached > 0 ? 'BREACHED' : 'CONTAINED'
    });
  }
}

// Bind 4 mode scenario buttons
const modeButtons = document.querySelectorAll('.mode-btn');
modeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    currentMode = btn.dataset.mode;
    modeButtons.forEach(b => b.classList.toggle('selected', b === btn));
    startSimulation();
  });
});

newRunBtn.addEventListener('click', () => {
  startSimulation();
});

window.addEventListener('resize', () => {
  layoutGraph();
});

window.addEventListener('load', () => {
  startSimulation();
});
</script>
