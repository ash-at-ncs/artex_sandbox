<style>
  :root {
    --bg: #000000;
    --turquoise: #00f0ff;
    --turquoise-glow: rgba(0, 240, 255, 0.45);
    --green: #00ff77;
    --green-glow: rgba(0, 255, 119, 0.65);
    --green-wire: rgba(0, 255, 119, 0.22);
    --red: #ff2244;
    --red-glow: rgba(255, 34, 68, 0.85);
    --red-wire: #ff2244;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--bg);
    color: #fff;
    font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', Consolas, monospace;
  }

  /* Full screen canvas and graph viewport */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 50%, #03080e 0%, #000000 100%);
    overflow: hidden;
  }

  /* Faint background grid for circuit cyber aesthetic */
  .circuit-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0, 255, 119, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 119, 0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
  }

  /* TOP HEADER - Mode selection strip + NEW RUN + Live HUD */
  .top-bar {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    z-index: 1000;
    pointer-events: none;
  }

  /* 4 Run Type Scenario Buttons along the top */
  .mode-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }

  .mode-btn {
    background: rgba(9, 16, 24, 0.88);
    border: 1px solid rgba(88, 217, 219, 0.22);
    color: #8fa3b8;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    backdrop-filter: blur(8px);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    text-align: left;
  }

  .mode-btn:hover {
    border-color: var(--turquoise);
    color: #e6edf5;
    background: rgba(14, 28, 38, 0.95);
    transform: translateY(-1px);
  }

  .mode-btn.selected {
    background: rgba(0, 36, 44, 0.95);
    border-color: var(--turquoise);
    color: var(--turquoise);
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.35), inset 0 0 8px rgba(0, 240, 255, 0.15);
  }

  .mode-btn .mode-title {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #abbecd;
  }

  .mode-btn.selected .mode-title {
    color: var(--turquoise);
  }

  .mode-btn .mode-desc {
    font-size: 7.5px;
    letter-spacing: 0.05em;
    color: #64788c;
    white-space: nowrap;
  }

  .mode-btn.selected .mode-desc {
    color: #8bebf0;
  }

  .run-row {
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: auto;
  }

  #new-run-btn {
    pointer-events: auto;
    background: rgba(0, 30, 36, 0.85);
    border: 1.5px solid var(--turquoise);
    color: var(--turquoise);
    padding: 7px 24px;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 16px var(--turquoise-glow), inset 0 0 10px rgba(0, 240, 255, 0.2);
    backdrop-filter: blur(10px);
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #new-run-btn:hover {
    background: var(--turquoise);
    color: #001015;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.85), inset 0 0 15px rgba(255, 255, 255, 0.7);
    transform: scale(1.04);
  }

  #new-run-btn:active {
    transform: scale(0.98);
  }

  #new-run-btn .run-icon {
    font-size: 12px;
    display: inline-block;
    transition: transform 0.4s ease;
  }

  #new-run-btn:hover .run-icon {
    transform: rotate(180deg);
  }

  /* Live Outcome HUD under NEW RUN button */
  #run-hud {
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--turquoise);
    background: rgba(0, 16, 22, 0.8);
    border: 1px solid rgba(0, 240, 255, 0.25);
    padding: 4px 14px;
    border-radius: 3px;
    backdrop-filter: blur(6px);
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    transition: all 0.3s ease;
  }
  #run-hud.breached {
    color: var(--red);
    border-color: rgba(255, 34, 68, 0.4);
    text-shadow: 0 0 8px rgba(255, 34, 68, 0.6);
    background: rgba(26, 4, 8, 0.85);
  }
  #run-hud.contained {
    color: #65d7a5;
    border-color: rgba(101, 215, 165, 0.4);
    text-shadow: 0 0 8px rgba(101, 215, 165, 0.6);
    background: rgba(4, 20, 14, 0.85);
  }

  /* Discreet nav link to return to table view */
  .back-link {
    position: absolute;
    top: 20px;
    right: 26px;
    pointer-events: auto;
    color: rgba(255, 255, 255, 0.35);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 5px 11px;
    border-radius: 3px;
    transition: all 0.2s;
    z-index: 1000;
  }
  .back-link:hover {
    color: var(--turquoise);
    border-color: var(--turquoise);
    background: rgba(0, 240, 255, 0.08);
  }

  /* SVG layer for wires and pulses */
  #wire-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .wire {
    fill: none;
    stroke: var(--green-wire);
    stroke-width: 1.25;
    stroke-linecap: round;
    transition: stroke 0.4s ease, stroke-width 0.3s ease, filter 0.3s ease, stroke-opacity 0.4s ease;
  }

  .wire.active-wire {
    stroke: var(--green);
    stroke-opacity: 0.75;
    stroke-width: 1.8;
    filter: drop-shadow(0 0 4px var(--green));
  }

  .wire.hit-wire {
    stroke: var(--red);
    stroke-opacity: 0.95;
    stroke-width: 2.2;
    filter: drop-shadow(0 0 6px var(--red-glow));
    stroke-dasharray: none;
  }

  /* Traveling energy packet along wires */
  .wire-packet {
    fill: var(--red);
    filter: drop-shadow(0 0 6px var(--red));
  }

  /* DOM Nodes Layer */
  #nodes-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    pointer-events: none;
  }

  /* Smaller, sleek node items */
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.15);
    z-index: 100;
  }

  /* Node Icon Box - Smaller */
  .node-icon-wrapper {
    position: relative;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Ambient glowing ring around icon */
  .node-halo {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px dashed var(--green);
    opacity: 0.35;
    transition: all 0.4s ease;
    animation: rotateSlow 25s linear infinite;
  }

  @keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* The Icon itself using pure CSS Mask: smaller, crisp, transparent */
  .node-icon {
    width: 26px;
    height: 26px;
    background-color: var(--green);
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-size: contain;
    mask-repeat: no-repeat;
    mask-position: center;
    filter: drop-shadow(0 0 5px var(--green-glow));
    transition: background-color 0.4s ease, filter 0.4s ease, transform 0.3s ease;
  }

  /* Node Label - Very Light Green for maximum legibility */
  .node-label {
    margin-top: 4px;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #d4ffe8;
    text-shadow: 0 0 5px rgba(212, 255, 232, 0.45);
    white-space: nowrap;
    text-align: center;
    max-width: 130px;
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }

  /* KEV Title underneath in RED (hidden initially, displays on hit) */
  .node-kev {
    margin-top: 3px;
    font-size: 7.5px;
    font-weight: 700;
    color: var(--red);
    text-shadow: 0 0 7px var(--red-glow);
    white-space: nowrap;
    text-align: center;
    max-width: 140px;
    background: rgba(45, 6, 12, 0.88);
    border: 1px solid rgba(255, 34, 68, 0.55);
    border-radius: 3px;
    padding: 2px 5px;
    opacity: 0;
    transform: translateY(-3px) scale(0.9);
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255, 34, 68, 0.3);
  }

  .node-kev .cve {
    font-weight: 800;
    letter-spacing: 0.05em;
  }

  .node-kev .vuln-title {
    display: block;
    font-size: 7px;
    opacity: 0.9;
    font-weight: 500;
  }

  /* HIT STATE: Lit in RED */
  .node.hit .node-icon {
    background-color: var(--red);
    filter: drop-shadow(0 0 12px var(--red-glow)) drop-shadow(0 0 20px var(--red));
    transform: scale(1.1);
  }

  .node.hit .node-halo {
    border-color: var(--red);
    border-style: solid;
    opacity: 0.85;
    box-shadow: 0 0 12px var(--red-glow);
    animation: hitPulse 1.2s ease-out infinite alternate;
  }

  .node.hit .node-label {
    color: #ff8899;
    text-shadow: 0 0 8px var(--red-glow);
  }

  .node.hit .node-kev {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* DEFENDED / BLOCKED STATE */
  .node.defended .node-icon {
    background-color: #f3bd64;
    filter: drop-shadow(0 0 10px rgba(243, 189, 100, 0.8));
    transform: scale(1.05);
  }
  .node.defended .node-halo {
    border-color: #f3bd64;
    border-style: double;
    opacity: 0.85;
    box-shadow: 0 0 10px rgba(243, 189, 100, 0.5);
  }
  .node.defended .node-label {
    color: #f3bd64;
    text-shadow: 0 0 6px rgba(243, 189, 100, 0.6);
  }
  .node.defended .node-kev {
    opacity: 1;
    transform: translateY(0) scale(1);
    color: #f3bd64;
    border-color: rgba(243, 189, 100, 0.6);
    background: rgba(30, 22, 6, 0.88);
    text-shadow: 0 0 8px rgba(243, 189, 100, 0.5);
    box-shadow: 0 0 10px rgba(243, 189, 100, 0.3);
  }

  /* DATABASE CLUSTER BREACH TARGET */
  .node.breach-target .node-icon {
    background-color: #ff003c;
    filter: drop-shadow(0 0 16px #ff003c) drop-shadow(0 0 28px #ff003c);
    animation: breachShake 0.4s ease infinite alternate;
  }
  .node.breach-target .node-kev {
    border-color: #ff003c;
    background: rgba(50, 0, 12, 0.95);
    box-shadow: 0 0 16px rgba(255, 0, 60, 0.7);
  }

  @keyframes breachShake {
    0% { transform: scale(1.12) rotate(-2deg); }
    100% { transform: scale(1.15) rotate(2deg); }
  }

  .wire.defended-wire {
    stroke: #765d34 !important;
    stroke-opacity: 0.7 !important;
    stroke-dasharray: 4 4 !important;
  }

  @keyframes hitPulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.22); opacity: 0.3; }
  }

  /* Flash impact burst when hit */
  .impact-burst {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--red);
    pointer-events: none;
    animation: burstExpand 0.65s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
  }

  @keyframes burstExpand {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(5.5); opacity: 0; }
  }
</style>

/**
 * Checks whether a given vulnerability can be addressed by the active mitigation scenario.
 */
function checkVulnMitigation(vulnId, mode, node) {
  if (mode === 'baseline') {
    return {
      addressed: false,
      badge: 'EXPLOITED',
      reason: 'Baseline scenario unmitigated: zero active defenses applied'
    };
  }

  const rule = KEV_MITIGATION_RULES[vulnId] || {
    waf: { mitigates: node.layerIdx <= 1, control: 'NIST SI-2', reason: 'Perimeter filtering rule' },
    ml:  { mitigates: node.layerIdx >= 1, control: 'NIST SI-4', reason: 'Internal anomaly detection' }
  };

  if (mode === 'patch') {
    // WAF only inspects HTTP/HTTPS traffic: completely blind to VPNs, SD-WAN, and private peered links
    const isNonHttpProtocol = node.groupId === 'aws-vpn' || 
                              node.groupId === 'az-net' || 
                              node.groupId === 'az-branch' || 
                              node.groupId === 'partner-gw';
    if (isNonHttpProtocol) {
      return {
        addressed: false,
        badge: 'WAF BLIND',
        reason: 'WAF operates at L7 HTTP; completely blind to VPN tunnels and network backbone protocols'
      };
    }

    if (rule.waf && rule.waf.mitigates) {
      return {
        addressed: true,
        badge: 'SHIELDED · WAF VIRTUAL PATCH',
        control: rule.waf.control,
        reason: rule.waf.reason
      };
    }
    return {
      addressed: false,
      badge: 'WAF BYPASS',
      reason: rule.waf ? rule.waf.reason : 'Vulnerability unaddressed by perimeter WAF'
    };
  }

  if (mode === 'defender') {
    if (rule.ml && rule.ml.mitigates) {
      return {
        addressed: true,
        badge: 'CONTAINED · BEHAVIORAL ML',
        control: rule.ml.control,
        reason: rule.ml.reason
      };
    }
    return {
      addressed: false,
      badge: 'ML MISSED',
      reason: rule.ml ? rule.ml.reason : 'Activity does not trigger behavioral threshold'
    };
  }

  if (mode === 'combined') {
    // Defense-in-depth: WAF + ML + Honeytokens
    if (rule.waf && rule.waf.mitigates) {
      return {
        addressed: true,
        badge: 'SHIELDED · WAF VIRTUAL PATCH',
        control: rule.waf.control,
        reason: rule.waf.reason
      };
    }
    if (rule.ml && rule.ml.mitigates) {
      return {
        addressed: true,
        badge: 'CONTAINED · ZERO-TRUST ML',
        control: rule.ml.control,
        reason: rule.ml.reason
      };
    }
    // Database honeypot alarm protection
    if (node.isLake || node.isDb || node.layerIdx === 3) {
      return {
        addressed: true,
        badge: 'TRAPPED · HONEYTOKEN TRIPWIRE',
        control: 'NIST SC-7 / SI-4',
        reason: 'Honeytoken canary tripwire halted database lateral dump'
      };
    }
    return {
      addressed: false,
      badge: 'UNADDRESSED',
      reason: 'Exploit mechanism evaded both WAF and behavioral detection'
    };
  }

  return { addressed: false, badge: 'EXPLOITED', reason: 'Unmitigated' };
}

/**
 * Organically position all objects across the screen and cluster them neatly.
 * Nodes are smaller, more numerous, and neatly grouped.
 */
function layoutGraph() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  currentNodes = [];
  currentWires = [];
  nodesLayer.innerHTML = '';
  svg.innerHTML = '';

  LAYER_CONFIG.forEach((layer, layerIdx) => {
    const numClusters = layer.clusters.length;
    const clusterHeight = (h * 0.76) / numClusters;
    const startY = h * 0.13;
    const layerKevPool = shuffle(LAYER_KEVS[layerIdx]);
    const assignedKevIdsInLayer = new Set();
    let kevIdx = 0;

    layer.clusters.forEach((cluster, clusterIdx) => {
      const clusterCenterY = startY + clusterIdx * clusterHeight + clusterHeight * 0.5 + rand(-h * 0.025, h * 0.025);
      const clusterCenterX = w * (layer.xBand[0] + (layer.xBand[1] - layer.xBand[0]) * 0.5) + rand(-w * 0.02, w * 0.02);

      const numTargets = cluster.targets.length;
      cluster.targets.forEach((targetDef, targetIdx) => {
        // Target family center anchor
        const familyAngle = (targetIdx / numTargets) * Math.PI * 2 - Math.PI / 2 + rand(-0.08, 0.08);
        const familyRadiusX = rand(58, 76);
        const familyRadiusY = rand(44, 58);
        const anchorX = Math.max(w * 0.05, Math.min(w * 0.94, clusterCenterX + Math.cos(familyAngle) * familyRadiusX));
        const anchorY = Math.max(h * 0.12, Math.min(h * 0.88, clusterCenterY + Math.sin(familyAngle) * familyRadiusY));

        // Randomly denser forest: 1 to 3 instances of the SAME icon clustered together
        const maxVariants = targetDef.variants.length;
        const instanceCount = maxVariants > 1 ? randInt(1, Math.min(3, maxVariants)) : 1;

        for (let vIdx = 0; vIdx < instanceCount; vIdx++) {
          let ox = 0, oy = 0;
          if (instanceCount === 2) {
            ox = (vIdx === 0 ? -22 : 22) + rand(-3, 3);
            oy = (vIdx === 0 ? -16 : 16) + rand(-3, 3);
          } else if (instanceCount === 3) {
            const iAngle = (vIdx / 3) * Math.PI * 2 - Math.PI / 2;
            ox = Math.cos(iAngle) * 24 + rand(-3, 3);
            oy = Math.sin(iAngle) * 20 + rand(-3, 3);
          }

          const nx = Math.max(w * 0.04, Math.min(w * 0.95, anchorX + ox));
          const ny = Math.max(h * 0.11, Math.min(h * 0.89, anchorY + oy));

          // Select matching CISA KEV tailored to this infrastructure target
          const targetKevIds = targetDef.matchingKevs || [];
          const layerPool = LAYER_KEVS[layerIdx];
          const candidateKevs = layerPool.filter(k => targetKevIds.includes(k.id));
          const availableKevs = candidateKevs.filter(k => !assignedKevIdsInLayer.has(k.id));

          let kev = null;
          if (availableKevs.length > 0) {
            kev = availableKevs[0];
            assignedKevIdsInLayer.add(kev.id);
          } else if (candidateKevs.length > 0) {
            kev = candidateKevs[vIdx % candidateKevs.length];
          } else {
            const unusedInLayer = layerPool.filter(k => !assignedKevIdsInLayer.has(k.id));
            kev = unusedInLayer.length > 0 ? unusedInLayer[0] : layerKevPool[kevIdx % layerKevPool.length];
            assignedKevIdsInLayer.add(kev.id);
            kevIdx++;
          }

          const node = {
            id: `${targetDef.id}-${vIdx + 1}`,
            groupId: targetDef.id,
            targetDef: targetDef,
            label: targetDef.variants[vIdx],
            icon: targetDef.icon,
            isSecurity: !!targetDef.isSecurity,
            isLake: !!targetDef.isLake,
            isDb: !!targetDef.isDb,
            layerIdx: layerIdx,
            clusterName: cluster.name,
            x: nx,
            y: ny,
            kev: kev,
            hit: false,
            defended: false,
            downstream: [],
            el: null
          };

          currentNodes.push(node);
        }
      });
    });
  });

  // Wires between layers
  currentNodes.forEach(source => {
    if (source.layerIdx < LAYER_CONFIG.length - 1) {
      const nextLayerNodes = currentNodes.filter(n => n.layerIdx === source.layerIdx + 1);
      const sortedCandidates = [...nextLayerNodes].sort((a, b) => Math.abs(a.y - source.y) - Math.abs(b.y - source.y));

      const numConn = randInt(1, Math.min(2, sortedCandidates.length));
      for (let i = 0; i < numConn; i++) {
        const pickIdx = Math.min(sortedCandidates.length - 1, Math.floor(Math.pow(Math.random(), 1.5) * sortedCandidates.length));
        const target = sortedCandidates[pickIdx];
        if (target && !source.downstream.includes(target.id)) {
          source.downstream.push(target.id);
          createWire(source, target);
        }
      }
    }
  });

  // Ensure every node has ingress connection
  currentNodes.forEach(target => {
    if (target.layerIdx > 0) {
      const hasUpstream = currentWires.some(w => w.target.id === target.id);
      if (!hasUpstream) {
        const prevLayerNodes = currentNodes.filter(n => n.layerIdx === target.layerIdx - 1);
        if (prevLayerNodes.length > 0) {
          const source = prevLayerNodes.reduce((closest, curr) => 
            Math.abs(curr.y - target.y) < Math.abs(closest.y - target.y) ? curr : closest
          );
          source.downstream.push(target.id);
          createWire(source, target);
        }
      }
    }
  });

  // Render DOM Nodes with smaller icons
  currentNodes.forEach(node => {
    const el = document.createElement('div');
    el.className = 'node';
    el.id = 'node-' + node.id;
    el.style.left = `${node.x}px`;
    el.style.top = `${node.y}px`;

    el.innerHTML = `
      <div class="node-icon-wrapper">
        <div class="node-halo"></div>
        <div class="node-icon" style="-webkit-mask-image: url('${ICON_BASE}${node.icon}'); mask-image: url('${ICON_BASE}${node.icon}');"></div>
      </div>
      <div class="node-label">${node.label}</div>
      <div class="node-kev">
        <span class="cve">${node.kev.id}</span>
        <span class="vuln-title">${node.kev.title}</span>
      </div>
    `;

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerNodeHit(node);
    });

    nodesLayer.appendChild(el);
    node.el = el;
  });

  window.currentNodes = currentNodes;
  window.currentWires = currentWires;
}

/**
 * Straight circuit lines between clusters
 */
function createWire(source, target) {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('class', 'wire');

  // Straight line connection
  const d = `M ${source.x} ${source.y} L ${target.x} ${target.y}`;
  path.setAttribute('d', d);

  svg.appendChild(path);

  currentWires.push({
    source,
    target,
    path,
    hit: false,
    defended: false
  });
}

/**
 * Resets the visual state of the existing infrastructure without rebuilding it.
 */
function resetInfraVisuals() {
  clearAllActiveTimeouts();

  // Remove active wire packets and impact bursts
  const packets = svg.querySelectorAll('.wire-packet');
  packets.forEach(p => p.remove());

  const bursts = nodesLayer.querySelectorAll('.impact-burst');
  bursts.forEach(b => b.remove());

  // Reset node DOM and data states
  currentNodes.forEach(node => {
    node.hit = false;
    node.defended = false;
    if (node.el) {
      node.el.className = 'node';
      node.el.removeAttribute('title');
      const kevEl = node.el.querySelector('.node-kev');
      if (kevEl) {
        kevEl.innerHTML = `
          <span class="cve">${node.kev.id}</span>
          <span class="vuln-title">${node.kev.title}</span>
        `;
      }
    }
  });

  // Reset wire DOM and data states
  currentWires.forEach(wire => {
    wire.hit = false;
    wire.defended = false;
    wire.path.setAttribute('class', 'wire');
  });

  runStats = { hits: 0, blocks: 0, lakesBreached: 0 };
  inFlightOperations = 0;
  layerHits = [0, 0, 0, 0];
  usedKevIdsPerLayer = [[], [], [], []];
  isSimulating = false;
}

/**
 * Returns a distinct CISA KEV tailored to the node's specific infrastructure icon/type,
 * guaranteeing that multiple compromises in the same layer never repeat the same vulnerability.
 */
function getDistinctKevForNode(node) {
  const layerIdx = node.layerIdx;
  const layerPool = LAYER_KEVS[layerIdx] || [];
  const targetKevIds = (node.targetDef && node.targetDef.matchingKevs) || [];
  
  // 1. First priority: KEVs that fit this exact infrastructure icon/type and haven't been used yet in this layer
  const matchingCandidates = layerPool.filter(k => targetKevIds.includes(k.id));
  const unusedMatching = matchingCandidates.filter(k => !usedKevIdsPerLayer[layerIdx].includes(k.id));
  
  let chosen = null;
  if (unusedMatching.length > 0) {
    chosen = unusedMatching[0];
  } else if (matchingCandidates.length > 0 && !usedKevIdsPerLayer[layerIdx].includes(node.kev.id)) {
    chosen = node.kev;
  } else {
    // 2. Any unused KEV in this layer
    const unusedInLayer = layerPool.filter(k => !usedKevIdsPerLayer[layerIdx].includes(k.id));
    if (unusedInLayer.length > 0) {
      chosen = unusedInLayer[0];
    } else {
      chosen = matchingCandidates.length > 0 ? matchingCandidates[0] : node.kev;
    }
  }
  
  usedKevIdsPerLayer[layerIdx].push(chosen.id);
  return chosen;
}

function triggerNodeHit(node, isExfil = false) {
  if (node.hit || node.defended) return;
  node.hit = true;
  runStats.hits++;

  // Ensure each hacked node in the layer displays a distinct CISA KEV
  const activeKev = getDistinctKevForNode(node);
  node.activeKev = activeKev;

  if (node.el) {
    node.el.classList.add('hit');
    if (isExfil || node.isLake || node.isDb) {
      node.el.classList.add('breach-target');
      runStats.lakesBreached++;
    }

    const kevEl = node.el.querySelector('.node-kev');
    if (kevEl) {
      kevEl.innerHTML = `
        <span class="cve">${activeKev.id}</span>
        <span class="vuln-title">${activeKev.title}</span>
      `;
    }

    const burst = document.createElement('div');
    burst.className = 'impact-burst';
    burst.style.left = `${node.x}px`;
    burst.style.top = `${node.y}px`;
    nodesLayer.appendChild(burst);
    safeTimeout(() => burst.remove(), 700);
  }
}

function triggerNodeDefense(node, wire, mitigation) {
  if (node.hit || node.defended) return;
  node.defended = true;
  runStats.blocks++;

  if (node.el) {
    node.el.classList.add('defended');
    const badgeText = mitigation.badge || 'CONTAINED';
    const subText = mitigation.control ? `${node.kev.id} · [${mitigation.control}]` : `Mitigated ${node.kev.id}`;
    node.el.setAttribute('title', `${badgeText}\n${mitigation.reason || ''}`);
    const kevEl = node.el.querySelector('.node-kev');
    if (kevEl) {
      kevEl.innerHTML = `<span class="cve">${badgeText}</span><span class="vuln-title">${subText}</span>`;
    }
  }

  if (wire) {
    wire.defended = true;
    wire.path.classList.add('defended-wire');
  }
}

function animateWirePulse(wire, onComplete) {
  const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  pulse.setAttribute('r', '3.5');
  pulse.setAttribute('class', 'wire-packet');
  svg.appendChild(pulse);

  wire.path.classList.add('active-wire');

  const pathEl = wire.path;
  const totalLength = pathEl.getTotalLength();
  const duration = rand(360, 640);
  const startTime = performance.now();

  function step(time) {
    const elapsed = time - startTime;
    const progress = Math.min(1, elapsed / duration);
    const point = pathEl.getPointAtLength(progress * totalLength);

    pulse.setAttribute('cx', point.x);
    pulse.setAttribute('cy', point.y);

    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      pulse.remove();
      wire.path.classList.remove('active-wire');
      if (onComplete) onComplete();
    }
  }

  requestAnimationFrame(step);
}

/**
 * Builds a fresh randomized infrastructure topology and runs the simulation.
 */
function generateNewInfra() {
  clearAllActiveTimeouts();
  layoutGraph();

  // Select 1-2 persistent ingress entry points for this infrastructure topology
  const ingressNodes = currentNodes.filter(n => n.layerIdx === 0);
  const startCount = randInt(1, 2);
  savedAttackOrigins = shuffle(ingressNodes).slice(0, startCount).map(n => n.id);

  runSimulationOnCurrentInfra();
}

/**
 * Runs the simulation on the CURRENT infrastructure and SAME assigned vulnerabilities.
 */
function runSimulationOnCurrentInfra() {
  resetInfraVisuals();
  isSimulating = true;
  window.isSimulating = true;
  runCount++;
  window.runCount = runCount;

  const scn = DEFENSE_SCENARIOS[currentMode] || DEFENSE_SCENARIOS.baseline;
  runHud.className = '';
  runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · SIMULATING ON SAME INFRA...`;

  const startNodes = savedAttackOrigins
    .map(id => currentNodes.find(n => n.id === id))
    .filter(Boolean);

  const entriesToUse = startNodes.length > 0 ? startNodes : currentNodes.filter(n => n.layerIdx === 0).slice(0, 1);

  entriesToUse.forEach((startNode, i) => {
    inFlightOperations++;
    safeTimeout(() => {
      // Ingress node vulnerability mitigation check:
      const ingressMitigation = checkVulnMitigation(startNode.kev.id, currentMode, startNode);

      if (ingressMitigation.addressed) {
        // Vulnerability addressed right at perimeter (e.g. WAF virtual patch blocks CGI / auth bypass)
        triggerNodeDefense(startNode, null, ingressMitigation);
        decrementInFlight();
      } else {
        // Vulnerability unmitigated: ingress node is compromised
        triggerNodeHit(startNode);
        layerHits[0]++;
        traverseFromNode(startNode, 1);
        decrementInFlight();
      }
    }, 220 + i * 320);
  });
}

function traverseFromNode(node, depth) {
  if (depth > 3) return;
  if (layerHits[depth] >= 3) return;

  const outgoingWires = currentWires.filter(w => w.source.id === node.id && !w.target.hit && !w.target.defended);
  if (outgoingWires.length === 0) return;

  const remainingBudget = 3 - layerHits[depth];
  if (remainingBudget <= 0) return;

  // 1-2 chaining per step, capped to max 3 hits per layer
  const chainCount = Math.min(remainingBudget, randInt(1, 2));
  const selectedWires = shuffle(outgoingWires).slice(0, chainCount);

  selectedWires.forEach((wire, idx) => {
    inFlightOperations++;
    const wireDelay = rand(280, 560) + idx * 180;
    safeTimeout(() => {
      animateWirePulse(wire, () => {
        const target = wire.target;
        if (target.hit || target.defended) {
          decrementInFlight();
          return;
        }

        // Domain-accurate vulnerability mitigation check for this target node & active scenario
        const mitigation = checkVulnMitigation(target.kev.id, currentMode, target);

        if (mitigation.addressed) {
          triggerNodeDefense(target, wire, mitigation);
          decrementInFlight();
        } else {
          if (layerHits[depth] < 3) {
            layerHits[depth]++;
            wire.hit = true;
            wire.path.classList.add('hit-wire');
            const isFinalLake = target.layerIdx === 3;
            triggerNodeHit(target, isFinalLake);

            // Multi-instance target group compromise: 1 or 2 get hacked by distinct vulns
            if (target.groupId && layerHits[depth] < 3 && Math.random() < 0.45) {
              const siblings = currentNodes.filter(n => n.groupId === target.groupId && n.id !== target.id && !n.hit && !n.defended);
              if (siblings.length > 0) {
                const siblingVic = shuffle(siblings)[0];
                safeTimeout(() => {
                  if (layerHits[depth] < 3 && !siblingVic.hit) {
                    layerHits[depth]++;
                    triggerNodeHit(siblingVic, target.isLake);
                  }
                }, 220);
              }
            }

            // Backend Clustered Database Lateral Compromise:
            // "when it hacks more than 1, pick a different KEV, we have a few per layer"
            if (isFinalLake && target.isDb) {
              const clusterPeers = currentNodes.filter(n => 
                n.layerIdx === 3 && n.clusterName === target.clusterName && n.id !== target.id && !n.hit && !n.defended
              );
              const extraDbCount = Math.min(randInt(1, 2), 3 - layerHits[3]);
              if (extraDbCount > 0 && clusterPeers.length > 0) {
                const victims = shuffle(clusterPeers).slice(0, extraDbCount);
                victims.forEach((vic, vIdx) => {
                  safeTimeout(() => {
                    if (layerHits[3] < 3) {
                      layerHits[3]++;
                      triggerNodeHit(vic, true);
                    }
                  }, 260 + vIdx * 180);
                });
              }
            }

            if (!isFinalLake) {
              traverseFromNode(target, depth + 1);
            }
          }
          decrementInFlight();
        }
      });
    }, wireDelay);
  });
}

function decrementInFlight() {
  inFlightOperations = Math.max(0, inFlightOperations - 1);
  if (inFlightOperations === 0) {
    finalizeSimulation();
  }
}

function finalizeSimulation() {
  isSimulating = false;
  window.isSimulating = false;
  window.runStats = runStats;
  const scn = DEFENSE_SCENARIOS[currentMode] || DEFENSE_SCENARIOS.baseline;
  if (runStats.lakesBreached > 0) {
    runHud.className = 'breached';
    runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · ${runStats.hits} KEVs EXPLOITED · ${runStats.blocks} CONTAINED · DATABASE CLUSTER COMPROMISED`;
  } else {
    runHud.className = 'contained';
    runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · ${runStats.blocks} BLOCKED AT BOUNDARY · ZERO-TRUST ARCHITECTURE PROTECTED DATABASES`;
  }

  if (window._onSimulationDone) {
    window._onSimulationDone({
      run: runCount,
      scenario: currentMode,
      hits: runStats.hits,
      blocks: runStats.blocks,
      lakesBreached: runStats.lakesBreached,
      status: runStats.lakesBreached > 0 ? 'BREACHED' : 'CONTAINED'
    });
  }
}

// Bind 4 mode scenario buttons: tests the SAME infrastructure with SAME vulns
const modeButtons = document.querySelectorAll('.mode-btn');
modeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    currentMode = btn.dataset.mode;
    modeButtons.forEach(b => b.classList.toggle('selected', b === btn));
    runSimulationOnCurrentInfra();
  });
});

// "NEW INFRA" generates a fresh infrastructure layout
newRunBtn.addEventListener('click', () => {
  generateNewInfra();
});

window.addEventListener('resize', () => {
  generateNewInfra();
});

window.addEventListener('load', () => {
  generateNewInfra();
});
</script>
