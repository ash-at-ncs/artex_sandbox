<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARTEX | Wire Diagram Simulation v2.4.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
  :root {
    --bg: #000000;
    --turquoise: #00f0ff;
    --turquoise-glow: rgba(0, 240, 255, 0.45);
    --green: #00ff77;
    --green-glow: rgba(0, 255, 119, 0.65);
    --green-wire: rgba(0, 255, 119, 0.22);
    --red: #ff2244;
    --red-glow: rgba(255, 34, 68, 0.85);
    --red-wire: #ff2244;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--bg);
    color: #fff;
    font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', Consolas, monospace;
  }

  /* Full screen canvas and graph viewport */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 50%, #03080e 0%, #000000 100%);
    overflow: hidden;
  }

  /* Faint background grid for circuit cyber aesthetic */
  .circuit-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0, 255, 119, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 119, 0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
  }

  /* TOP HEADER - Mode selection strip + NEW RUN + Live HUD */
  .top-bar {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 0 150px 0 12px;
    z-index: 1000;
    pointer-events: none;
  }

  /* 4 Run Type Scenario Buttons along the top */
  .mode-strip {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }

  .mode-btn {
    background: rgba(9, 16, 24, 0.88);
    border: 1px solid rgba(88, 217, 219, 0.22);
    color: #8fa3b8;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    backdrop-filter: blur(8px);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    text-align: left;
  }

  .mode-btn:hover {
    border-color: var(--turquoise);
    color: #e6edf5;
    background: rgba(14, 28, 38, 0.95);
    transform: translateY(-1px);
  }

  .mode-btn.selected {
    background: rgba(0, 36, 44, 0.95);
    border-color: var(--turquoise);
    color: var(--turquoise);
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.35), inset 0 0 8px rgba(0, 240, 255, 0.15);
  }

  .mode-btn .mode-title {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #abbecd;
  }

  .mode-btn.selected .mode-title {
    color: var(--turquoise);
  }

  .mode-btn .mode-desc {
    font-size: 7.5px;
    letter-spacing: 0.05em;
    color: #64788c;
    white-space: nowrap;
  }

  .mode-btn.selected .mode-desc {
    color: #8bebf0;
  }

  .run-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }

  #connector-style-btn {
    background: rgba(0, 30, 36, 0.85);
    border: 1px solid var(--turquoise);
    border-radius: 4px;
    color: var(--turquoise);
    cursor: pointer;
    font: inherit;
    font-size: 10px;
    padding: 5px 8px;
    white-space: nowrap;
  }

  #connector-style-btn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }

  #new-run-btn {
    pointer-events: auto;
    background: rgba(0, 30, 36, 0.85);
    border: 1.5px solid var(--turquoise);
    color: var(--turquoise);
    padding: 5px 14px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 16px var(--turquoise-glow), inset 0 0 10px rgba(0, 240, 255, 0.2);
    backdrop-filter: blur(10px);
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #new-run-btn:hover {
    background: var(--turquoise);
    color: #001015;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.85), inset 0 0 15px rgba(255, 255, 255, 0.7);
    transform: scale(1.04);
  }

  #new-run-btn:active {
    transform: scale(0.98);
  }

  #new-run-btn .run-icon {
    font-size: 12px;
    display: inline-block;
    transition: transform 0.4s ease;
  }

  #new-run-btn:hover .run-icon {
    transform: rotate(180deg);
  }

  /* Live Outcome HUD under NEW RUN button */
  #run-hud {
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--turquoise);
    background: rgba(0, 16, 22, 0.8);
    border: 1px solid rgba(0, 240, 255, 0.25);
    padding: 4px 9px;
    border-radius: 3px;
    backdrop-filter: blur(6px);
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    transition: all 0.3s ease;
  }
  #run-hud.breached {
    color: var(--red);
    border-color: rgba(255, 34, 68, 0.4);
    text-shadow: 0 0 8px rgba(255, 34, 68, 0.6);
    background: rgba(26, 4, 8, 0.85);
  }
  #run-hud.contained {
    color: #65d7a5;
    border-color: rgba(101, 215, 165, 0.4);
    text-shadow: 0 0 8px rgba(101, 215, 165, 0.6);
    background: rgba(4, 20, 14, 0.85);
  }

  /* Discreet nav link to return to table view */
  .back-link {
    position: absolute;
    top: 20px;
    right: 26px;
    pointer-events: auto;
    color: rgba(255, 255, 255, 0.35);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 5px 11px;
    border-radius: 3px;
    transition: all 0.2s;
    z-index: 1000;
  }
  .back-link:hover {
    color: var(--turquoise);
    border-color: var(--turquoise);
    background: rgba(0, 240, 255, 0.08);
  }

  /* SVG layer for wires and pulses */
  #wire-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .wire {
    fill: none;
    stroke: var(--green-wire);
    stroke-width: 1.25;
    stroke-linecap: round;
    transition: stroke 0.4s ease, stroke-width 0.3s ease, filter 0.3s ease, stroke-opacity 0.4s ease;
  }

  .attack-entry {
    fill: none;
    stroke: #ff304f;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 9 6;
    filter: drop-shadow(0 0 5px rgba(255, 34, 68, 0.75));
  }

  .attack-entry-head {
    fill: #ff304f;
    filter: drop-shadow(0 0 5px rgba(255, 34, 68, 0.75));
  }

  .wire.active-wire {
    stroke: var(--green);
    stroke-opacity: 0.75;
    stroke-width: 1.8;
    filter: drop-shadow(0 0 4px var(--green));
  }

  .wire.hit-wire {
    stroke: var(--red);
    stroke-opacity: 0.95;
    stroke-width: 2.2;
    filter: drop-shadow(0 0 6px var(--red-glow));
    stroke-dasharray: none;
  }

  /* Traveling energy packet along wires */
  .wire-packet {
    fill: var(--red);
    filter: drop-shadow(0 0 6px var(--red));
  }

  /* DOM Nodes Layer */
  #nodes-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    pointer-events: none;
  }

  /* Smaller, sleek node items */
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.15);
    z-index: 100;
  }

  /* Node Icon Box - Smaller */
  .node-icon-wrapper {
    position: relative;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Ambient glowing ring around icon */
  .node-halo {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px dashed var(--green);
    opacity: 0.35;
    transition: all 0.4s ease;
    animation: rotateSlow 25s linear infinite;
  }

  @keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* The Icon itself using pure CSS Mask: smaller, crisp, transparent */
  .node-icon {
    width: 26px;
    height: 26px;
    background-color: var(--green);
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-size: contain;
    mask-repeat: no-repeat;
    mask-position: center;
    filter: drop-shadow(0 0 5px var(--green-glow));
    transition: background-color 0.4s ease, filter 0.4s ease, transform 0.3s ease;
  }

  /* Node Label - Very Light Green for maximum legibility */
  .node-label {
    margin-top: 4px;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #d4ffe8;
    text-shadow: 0 0 5px rgba(212, 255, 232, 0.45);
    white-space: nowrap;
    text-align: center;
    max-width: 130px;
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }

  /* KEV Title underneath in RED (hidden initially, displays on hit) */
  .node-kev {
    margin-top: 3px;
    font-size: 7.5px;
    font-weight: 700;
    color: var(--red);
    text-shadow: 0 0 7px var(--red-glow);
    white-space: nowrap;
    text-align: center;
    max-width: 140px;
    background: rgba(45, 6, 12, 0.88);
    border: 1px solid rgba(255, 34, 68, 0.55);
    border-radius: 3px;
    padding: 2px 5px;
    opacity: 0;
    transform: translateY(-3px) scale(0.9);
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255, 34, 68, 0.3);
  }

  .node-kev .cve {
    font-weight: 800;
    letter-spacing: 0.05em;
  }

  .node-kev .vuln-title {
    display: block;
    font-size: 7px;
    opacity: 0.9;
    font-weight: 500;
  }

  /* HIT STATE: Lit in RED */
  .node.hit .node-icon {
    background-color: var(--red);
    filter: drop-shadow(0 0 12px var(--red-glow)) drop-shadow(0 0 20px var(--red));
    transform: scale(1.1);
  }

  .node.hit .node-halo {
    border-color: var(--red);
    border-style: solid;
    opacity: 0.85;
    box-shadow: 0 0 12px var(--red-glow);
    animation: hitPulse 1.2s ease-out infinite alternate;
  }

  .node.hit .node-label {
    color: #ff8899;
    text-shadow: 0 0 8px var(--red-glow);
  }

  .node.hit .node-kev {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* DEFENDED / BLOCKED STATE */
  .node.defended .node-icon {
    background-color: #f3bd64;
    filter: drop-shadow(0 0 10px rgba(243, 189, 100, 0.8));
    transform: scale(1.05);
  }
  .node.defended .node-halo {
    border-color: #f3bd64;
    border-style: double;
    opacity: 0.85;
    box-shadow: 0 0 10px rgba(243, 189, 100, 0.5);
  }
  .node.defended .node-label {
    color: #f3bd64;
    text-shadow: 0 0 6px rgba(243, 189, 100, 0.6);
  }
  .node.defended .node-kev {
    opacity: 1;
    transform: translateY(0) scale(1);
    color: #f3bd64;
    border-color: rgba(243, 189, 100, 0.6);
    background: rgba(30, 22, 6, 0.88);
    text-shadow: 0 0 8px rgba(243, 189, 100, 0.5);
    box-shadow: 0 0 10px rgba(243, 189, 100, 0.3);
  }

  /* DATABASE CLUSTER BREACH TARGET */
  .node.breach-target .node-icon {
    background-color: #ff003c;
    filter: drop-shadow(0 0 16px #ff003c) drop-shadow(0 0 28px #ff003c);
    animation: breachShake 0.4s ease infinite alternate;
  }
  .node.breach-target .node-kev {
    border-color: #ff003c;
    background: rgba(50, 0, 12, 0.95);
    box-shadow: 0 0 16px rgba(255, 0, 60, 0.7);
  }

  @keyframes breachShake {
    0% { transform: scale(1.12) rotate(-2deg); }
    100% { transform: scale(1.15) rotate(2deg); }
  }

  .wire.defended-wire {
    stroke: #765d34 !important;
    stroke-opacity: 0.7 !important;
    stroke-dasharray: 4 4 !important;
  }

  @keyframes hitPulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.22); opacity: 0.3; }
  }

  /* Flash impact burst when hit */
  .impact-burst {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--red);
    pointer-events: none;
    animation: burstExpand 0.65s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
  }

  @keyframes burstExpand {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(5.5); opacity: 0; }
  }
</style>

/**
 * Checks whether a given vulnerability can be addressed by the active mitigation scenario.
 */
function checkVulnMitigation(vulnId, mode, node) {
  if (!vulnId) {
    if (mode === 'combined' && (node.isLake || node.isDb || node.layerIdx === 3)) {
      return { addressed: true, badge: 'TRAPPED · HONEYTOKEN TRIPWIRE', control: 'NIST SI-4', reason: 'Simulated honeytoken tripwire stopped access to the data target.' };
    }
    return { addressed: false, badge: 'SIMULATED ACCESS', reason: 'No CVE is mapped to this asset; the path assumes access.' };
  }
  if (mode === 'baseline') {
    return {
      addressed: false,
      badge: 'EXPLOITED',
      reason: 'Baseline scenario unmitigated: zero active defenses applied'
    };
  }

  const rule = KEV_MITIGATION_RULES[vulnId] || {
    waf: { mitigates: node.layerIdx <= 1, control: 'NIST SI-2', reason: 'Perimeter filtering rule' },
    ml:  { mitigates: node.layerIdx >= 1, control: 'NIST SI-4', reason: 'Internal anomaly detection' }
  };
  const isNonHttpProtocol = ['aws-vpn', 'az-net', 'az-branch', 'partner-gw'].includes(node.groupId);

  if (mode === 'patch') {
    // WAF only inspects HTTP/HTTPS traffic: completely blind to VPNs, SD-WAN, and private peered links
    if (isNonHttpProtocol) {
      return {
        addressed: false,
        badge: 'WAF BLIND',
        reason: 'WAF operates at L7 HTTP; completely blind to VPN tunnels and network backbone protocols'
      };
    }

    if (!isNonHttpProtocol && rule.waf && rule.waf.mitigates) {
      return {
        addressed: true,
        badge: 'SHIELDED · WAF VIRTUAL PATCH',
        control: rule.waf.control,
        reason: rule.waf.reason
      };
    }
    return {
      addressed: false,
      badge: 'WAF BYPASS',
      reason: rule.waf ? rule.waf.reason : 'Vulnerability unaddressed by perimeter WAF'
    };
  }

  if (mode === 'defender') {
    if (rule.ml && rule.ml.mitigates) {
      return {
        addressed: true,
        badge: 'CONTAINED · BEHAVIORAL ML',
        control: rule.ml.control,
        reason: rule.ml.reason
      };
    }
    return {
      addressed: false,
      badge: 'ML MISSED',
      reason: rule.ml ? rule.ml.reason : 'Activity does not trigger behavioral threshold'
    };
  }

  if (mode === 'combined') {
    // Defense-in-depth: WAF + ML + Honeytokens
    if (!isNonHttpProtocol && rule.waf && rule.waf.mitigates) {
      return {
        addressed: true,
        badge: 'SHIELDED · WAF VIRTUAL PATCH',
        control: rule.waf.control,
        reason: rule.waf.reason
      };
    }
    if (rule.ml && rule.ml.mitigates) {
      return {
        addressed: true,
        badge: 'CONTAINED · ZERO-TRUST ML',
        control: rule.ml.control,
        reason: rule.ml.reason
      };
    }
    // Database honeypot alarm protection
    if (node.isLake || node.isDb || node.layerIdx === 3) {
      return {
        addressed: true,
        badge: 'TRAPPED · HONEYTOKEN TRIPWIRE',
        control: 'NIST SC-7 / SI-4',
        reason: 'Honeytoken canary tripwire halted database lateral dump'
      };
    }
    return {
      addressed: false,
      badge: 'UNADDRESSED',
      reason: 'Exploit mechanism evaded both WAF and behavioral detection'
    };
  }

  return { addressed: false, badge: 'EXPLOITED', reason: 'Unmitigated' };
}

/**
 * Organically position all objects across the screen and cluster them neatly.
 * Nodes are smaller, more numerous, and neatly grouped.
 */
function layoutGraph() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  // Reserve space for the controls and node labels at the top and bottom.
  const graphTop = Math.min(h * 0.4, document.querySelector('.top-bar').getBoundingClientRect().bottom + 65);
  const graphBottom = Math.max(graphTop + 1, h - 65);
  const graphHeight = graphBottom - graphTop;
  currentNodes = [];
  currentWires = [];
  nodesLayer.innerHTML = '';
  svg.innerHTML = '';

  LAYER_CONFIG.forEach((layer, layerIdx) => {
    const numClusters = layer.clusters.length;
    const clusterHeight = graphHeight / numClusters;
    const startY = graphTop;

    layer.clusters.forEach((cluster, clusterIdx) => {
      const clusterCenterY = startY + clusterIdx * clusterHeight + clusterHeight * 0.5 + rand(-h * 0.025, h * 0.025);
      const clusterCenterX = w * (layer.xBand[0] + (layer.xBand[1] - layer.xBand[0]) * 0.5) + rand(-w * 0.02, w * 0.02);

      const numTargets = cluster.targets.length;
      cluster.targets.forEach((targetDef, targetIdx) => {
        // Target family center anchor
        const familyAngle = (targetIdx / numTargets) * Math.PI * 2 - Math.PI / 2 + rand(-0.08, 0.08);
        const familyRadiusX = rand(58, 76);
        const familyRadiusY = rand(44, 58);
        const anchorX = Math.max(w * 0.05, Math.min(w * 0.94, clusterCenterX + Math.cos(familyAngle) * familyRadiusX));
        const anchorY = Math.max(graphTop, Math.min(graphBottom, clusterCenterY + Math.sin(familyAngle) * familyRadiusY));

        // Randomly denser forest: 1 to 3 instances of the SAME icon clustered together
        const maxVariants = targetDef.variants.length;
        const instanceCount = maxVariants > 1 ? randInt(1, Math.min(3, maxVariants)) : 1;

        for (let vIdx = 0; vIdx < instanceCount; vIdx++) {
          let ox = 0, oy = 0;
          if (instanceCount === 2) {
            ox = (vIdx === 0 ? -22 : 22) + rand(-3, 3);
            oy = (vIdx === 0 ? -16 : 16) + rand(-3, 3);
          } else if (instanceCount === 3) {
            const iAngle = (vIdx / 3) * Math.PI * 2 - Math.PI / 2;
            ox = Math.cos(iAngle) * 24 + rand(-3, 3);
            oy = Math.sin(iAngle) * 20 + rand(-3, 3);
          }

          const nx = Math.max(w * 0.04, Math.min(w * 0.95, anchorX + ox));
          const ny = Math.max(graphTop, Math.min(graphBottom, anchorY + oy));

          // Only explicit per-variant product mappings are eligible. Versions and
          // vulnerable configurations are assumed for this synthetic scenario.
          const kevId = (targetDef.kevByVariant || [])[vIdx];
          const kev = kevId ? LAYER_KEVS[layerIdx].find(k => k.id === kevId) : null;
          if (kevId && !kev) throw new Error(`Unknown CVE ${kevId} for ${targetDef.id}`);

          const node = {
            id: `${targetDef.id}-${vIdx + 1}`,
            groupId: targetDef.id,
            targetDef: targetDef,
            label: targetDef.variants[vIdx],
            icon: targetDef.icon,
            isSecurity: !!targetDef.isSecurity,
            isLake: !!targetDef.isLake,
            isDb: !!targetDef.isDb,
            layerIdx: layerIdx,
            clusterName: cluster.name,
            x: nx,
            y: ny,
            kev: kev,
            hit: false,
            defended: false,
            downstream: [],
            el: null
          };

          currentNodes.push(node);
        }
      });
    });
  });

  // Connect each source only to explicitly modeled service families.
  currentNodes.forEach(source => {
    (ALLOWED_CONNECTIONS[source.groupId] || []).forEach(targetGroup => {
      const candidates = currentNodes.filter(n => n.groupId === targetGroup && n.layerIdx === source.layerIdx + 1);
      if (!candidates.length) return;
      const target = candidates.reduce((a, b) => Math.abs(a.y - source.y) < Math.abs(b.y - source.y) ? a : b);
      source.downstream.push(target.id);
      createWire(source, target);
    });
  });

  // Connect remaining instances only when an approved predecessor exists.
  currentNodes.forEach(target => {
    if (currentWires.some(w => w.target.id === target.id)) return;
    const candidates = currentNodes.filter(n => n.layerIdx === target.layerIdx - 1 &&
      (ALLOWED_CONNECTIONS[n.groupId] || []).includes(target.groupId));
    if (!candidates.length) return;
    const source = candidates.reduce((a, b) => Math.abs(a.y - target.y) < Math.abs(b.y - target.y) ? a : b);
    source.downstream.push(target.id);
    createWire(source, target);
  });

  // Render DOM Nodes with smaller icons
  currentNodes.forEach(node => {
    const el = document.createElement('div');
    el.className = 'node';
    el.id = 'node-' + node.id;
    el.title = node.kev
      ? 'Simulated CVE mapping: an affected version and configuration are assumed.'
      : 'Simulated access: no CVE is assigned to this asset.';
    el.style.left = `${node.x}px`;
    el.style.top = `${node.y}px`;

    el.innerHTML = `
      <div class="node-icon-wrapper">
        <div class="node-halo"></div>
        <div class="node-icon" style="-webkit-mask-image: url('${ICON_BASE}${node.icon}'); mask-image: url('${ICON_BASE}${node.icon}');"></div>
      </div>
      <div class="node-label">${node.label}</div>
      <div class="node-kev">
        <span class="cve">${node.kev ? node.kev.id : 'SIMULATED ACCESS'}</span>
        <span class="vuln-title">${node.kev ? node.kev.title : 'No CVE mapped to this asset'}</span>
      </div>
    `;

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerNodeHit(node);
    });

    nodesLayer.appendChild(el);
    node.el = el;
  });

  window.currentNodes = currentNodes;
  window.currentWires = currentWires;
}

let curvedConnectors = false;

function updateWirePath(wire) {
  const { source, target, curve } = wire;
  const d = curvedConnectors
    ? `M ${source.x} ${source.y} C ${curve.p1x} ${curve.p1y}, ${curve.p2x} ${curve.p2y}, ${target.x} ${target.y}`
    : `M ${source.x} ${source.y} L ${target.x} ${target.y}`;
  wire.path.setAttribute('d', d);
}

function createWire(source, target) {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('class', 'wire');
  svg.appendChild(path);
  const dx = target.x - source.x;
  const wire = {
    source,
    target,
    path,
    curve: {
      p1x: source.x + dx * 0.5 + rand(-15, 15),
      p1y: source.y + rand(-10, 10),
      p2x: source.x + dx * 0.5 + rand(-15, 15),
      p2y: target.y + rand(-10, 10)
    },
    hit: false,
    defended: false
  };
  updateWirePath(wire);
  currentWires.push(wire);
}

function drawAttackEntries(nodes) {
  nodes.forEach(node => {
    const endX = Math.max(8, node.x - 24);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    line.setAttribute('class', 'attack-entry');
    line.setAttribute('d', `M -20 ${node.y} L ${endX} ${node.y}`);
    svg.appendChild(line);

    const head = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    head.setAttribute('class', 'attack-entry-head');
    head.setAttribute('d', `M ${endX} ${node.y} l -11 -7 v 14 z`);
    svg.appendChild(head);
  });
}

/**
 * Resets the visual state of the existing infrastructure without rebuilding it.
 */
function resetInfraVisuals() {
  simulationGeneration++;
  clearAllActiveTimeouts();

  // Remove active wire packets and impact bursts
  const packets = svg.querySelectorAll('.wire-packet');
  packets.forEach(p => p.remove());

  const bursts = nodesLayer.querySelectorAll('.impact-burst');
  bursts.forEach(b => b.remove());

  // Reset node DOM and data states
  currentNodes.forEach(node => {
    node.hit = false;
    node.defended = false;
    if (node.el) {
      node.el.className = 'node';
      node.el.title = node.kev
        ? 'Simulated CVE mapping: an affected version and configuration are assumed.'
        : 'Simulated access: no CVE is assigned to this asset.';
      const kevEl = node.el.querySelector('.node-kev');
      if (kevEl) {
        kevEl.innerHTML = `
          <span class="cve">${node.kev ? node.kev.id : 'SIMULATED ACCESS'}</span>
          <span class="vuln-title">${node.kev ? node.kev.title : 'No CVE mapped to this asset'}</span>
        `;
      }
    }
  });

  // Reset wire DOM and data states
  currentWires.forEach(wire => {
    wire.hit = false;
    wire.defended = false;
    wire.path.setAttribute('class', 'wire');
  });

  runStats = { hits: 0, blocks: 0, lakesBreached: 0 };
  inFlightOperations = 0;
  layerHits = [0, 0, 0, 0];
  isSimulating = false;
}

function triggerNodeHit(node, isExfil = false) {
  if (node.hit || node.defended) return;
  node.hit = true;
  runStats.hits++;

  const activeKev = node.kev;

  if (node.el) {
    node.el.classList.add('hit');
    if (isExfil || node.isLake || node.isDb) {
      node.el.classList.add('breach-target');
      runStats.lakesBreached++;
    }

    const kevEl = node.el.querySelector('.node-kev');
    if (kevEl) {
      kevEl.innerHTML = `
        <span class="cve">${activeKev ? activeKev.id : 'SIMULATED ACCESS'}</span>
        <span class="vuln-title">${activeKev ? activeKev.title : 'No CVE mapped to this asset'}</span>
      `;
    }

    const burst = document.createElement('div');
    burst.className = 'impact-burst';
    burst.style.left = `${node.x}px`;
    burst.style.top = `${node.y}px`;
    nodesLayer.appendChild(burst);
    safeTimeout(() => burst.remove(), 700);
  }
}

function triggerNodeDefense(node, wire, mitigation) {
  if (node.hit || node.defended) return;
  node.defended = true;
  runStats.blocks++;

  if (node.el) {
    node.el.classList.add('defended');
    const badgeText = mitigation.badge || 'CONTAINED';
    const targetText = node.kev ? node.kev.id : 'SIMULATED ACCESS';
    const subText = mitigation.control ? `${targetText} · [${mitigation.control}]` : `Mitigated ${targetText}`;
    node.el.setAttribute('title', `${badgeText}\n${mitigation.reason || ''}`);
    const kevEl = node.el.querySelector('.node-kev');
    if (kevEl) {
      kevEl.innerHTML = `<span class="cve">${badgeText}</span><span class="vuln-title">${subText}</span>`;
    }
  }

  if (wire) {
    wire.defended = true;
    wire.path.classList.add('defended-wire');
  }
}

function animateWirePulse(wire, onComplete) {
  const generation = simulationGeneration;
  const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  pulse.setAttribute('r', '3.5');
  pulse.setAttribute('class', 'wire-packet');
  svg.appendChild(pulse);

  wire.path.classList.add('active-wire');

  const pathEl = wire.path;
  const duration = 450;
  const startTime = performance.now();

  function step(time) {
    if (generation !== simulationGeneration) return;
    const elapsed = time - startTime;
    const progress = Math.min(1, elapsed / duration);
    const point = pathEl.getPointAtLength(progress * pathEl.getTotalLength());

    pulse.setAttribute('cx', point.x);
    pulse.setAttribute('cy', point.y);

    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      pulse.remove();
      wire.path.classList.remove('active-wire');
      if (onComplete) onComplete();
    }
  }

  requestAnimationFrame(step);
}

/**
 * Builds a fresh randomized infrastructure topology and runs the simulation.
 */
function generateNewInfra() {
  clearAllActiveTimeouts();
  layoutGraph();

  // Select 1-2 persistent ingress entry points for this infrastructure topology
  const ingressNodes = currentNodes.filter(n => EXTERNAL_ENTRY_GROUPS.has(n.groupId) && n.downstream.length > 0);
  const startCount = randInt(1, 2);
  const origins = shuffle(ingressNodes).slice(0, startCount);
  savedAttackOrigins = origins.map(n => n.id);
  attackChoices = new Map(currentNodes.map(node => [node.id,
    shuffle(currentWires.filter(wire => wire.source.id === node.id)).slice(0, randInt(1, 2))
  ]));
  drawAttackEntries(origins);

  runSimulationOnCurrentInfra();
}

/**
 * Runs the simulation on the CURRENT infrastructure and SAME assigned vulnerabilities.
 */
function runSimulationOnCurrentInfra() {
  resetInfraVisuals();
  isSimulating = true;
  window.isSimulating = true;
  runCount++;
  window.runCount = runCount;

  const scn = DEFENSE_SCENARIOS[currentMode] || DEFENSE_SCENARIOS.baseline;
  runHud.className = '';
  runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · SIMULATING ON SAME INFRA...`;

  const startNodes = savedAttackOrigins
    .map(id => currentNodes.find(n => n.id === id))
    .filter(Boolean);

  // Build the complete result synchronously in a stable order. Animation cannot
  // affect the outcome, and all scenarios use the same chosen attack paths.
  const queue = startNodes.map(node => ({ node, wire: null }));
  const visited = new Set();
  const hitsByLayer = [0, 0, 0, 0];
  const events = [];
  while (queue.length) {
    const { node, wire } = queue.shift();
    if (visited.has(node.id)) continue;
    const mitigation = checkVulnMitigation(node.kev && node.kev.id, currentMode, node);
    if (!mitigation.addressed && hitsByLayer[node.layerIdx] >= 3) continue;
    visited.add(node.id);
    events.push({ node, wire, mitigation });
    if (!mitigation.addressed) {
      hitsByLayer[node.layerIdx]++;
      (attackChoices.get(node.id) || []).forEach(next => queue.push({ node: next.target, wire: next }));
    }
  }

  function playEvent(index) {
    if (index >= events.length) { finalizeSimulation(); return; }
    const { node, wire, mitigation } = events[index];
    const apply = () => {
      if (mitigation.addressed) triggerNodeDefense(node, wire, mitigation);
      else {
        if (wire) { wire.hit = true; wire.path.classList.add('hit-wire'); }
        triggerNodeHit(node, node.layerIdx === 3);
      }
      safeTimeout(() => playEvent(index + 1), 120);
    };
    if (wire) animateWirePulse(wire, apply);
    else safeTimeout(apply, 220);
  }
  playEvent(0);
}

function finalizeSimulation() {
  isSimulating = false;
  window.isSimulating = false;
  window.runStats = runStats;
  const scn = DEFENSE_SCENARIOS[currentMode] || DEFENSE_SCENARIOS.baseline;
  if (runStats.lakesBreached > 0) {
    runHud.className = 'breached';
    runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · ${runStats.hits} NODES COMPROMISED · ${runStats.blocks} CONTAINED · DATA TARGET REACHED`;
  } else {
    runHud.className = 'contained';
    runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · ${runStats.hits} NODES COMPROMISED · ${runStats.blocks} CONTAINED · DATA TARGET NOT REACHED`;
  }

  if (window._onSimulationDone) {
    window._onSimulationDone({
      run: runCount,
      scenario: currentMode,
      hits: runStats.hits,
      blocks: runStats.blocks,
      lakesBreached: runStats.lakesBreached,
      status: runStats.lakesBreached > 0 ? 'BREACHED' : 'CONTAINED'
    });
  }
}

// Bind 4 mode scenario buttons: tests the SAME infrastructure with SAME vulns
const connectorStyleBtn = document.getElementById('connector-style-btn');
connectorStyleBtn.addEventListener('click', () => {
  curvedConnectors = !curvedConnectors;
  connectorStyleBtn.setAttribute('aria-pressed', String(curvedConnectors));
  connectorStyleBtn.textContent = `CONNECTORS: ${curvedConnectors ? 'CURVED' : 'STRAIGHT'}`;
  currentWires.forEach(updateWirePath);
});

const modeButtons = document.querySelectorAll('.mode-btn');
modeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    currentMode = btn.dataset.mode;
    modeButtons.forEach(b => b.classList.toggle('selected', b === btn));
    runSimulationOnCurrentInfra();
  });
});

// "NEW INFRA" generates a fresh infrastructure layout
newRunBtn.addEventListener('click', () => {
  generateNewInfra();
});

window.addEventListener('resize', () => {
  generateNewInfra();
});

window.addEventListener('load', () => {
  generateNewInfra();
});
</script>
